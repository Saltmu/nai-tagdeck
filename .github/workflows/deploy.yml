name: Deploy nai-tagdeck

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview files without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nai-tagdeck-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload the build over SFTP
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          if [[ ! "$DEPLOY_HOST" =~ ^[[:alnum:]][[:alnum:].-]*$ ||
                ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo '::error::Check DEPLOY_HOST and DEPLOY_PORT.'
            exit 1
          fi

          ssh_dir=$(mktemp -d)
          check_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir" "$check_dir"' EXIT
          umask 077
          expected_fingerprint="${DEPLOY_HOST_FINGERPRINT%=}"
          discover_fingerprint=false
          if [[ "$DRY_RUN" == true && -z "$DEPLOY_HOST_FINGERPRINT" ]]; then
            discover_fingerprint=true
          elif [[ ! "$expected_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo '::error::Set DEPLOY_HOST_FINGERPRINT to the verified SHA256 fingerprint of the SFTP server.'
            exit 1
          fi

          if ! env -u LFTP_PASSWORD ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$ssh_dir/scanned_keys" 2>/dev/null; then
            echo '::error::Could not retrieve a host key from the SFTP server.'
            exit 1
          fi

          if [[ "$discover_fingerprint" == true ]]; then
            echo 'Observed host fingerprints (unverified):'
            ssh-keygen -E sha256 -lf "$ssh_dir/scanned_keys" | awk '{print $2, $NF}'
            echo '::notice::Fingerprint discovery only. SFTP login and deployment preview were skipped. Verify one fingerprint independently before setting DEPLOY_HOST_FINGERPRINT.'
            exit 0
          fi

          while IFS= read -r entry; do
            if key_info=$(ssh-keygen -E sha256 -lf - <<< "$entry" 2>/dev/null); then
              read -r _ fingerprint _ <<< "$key_info"
              if [[ "$fingerprint" == "$expected_fingerprint" ]]; then
                printf '%s\n' "$entry" > "$ssh_dir/known_hosts"
                break
              fi
            fi
          done < "$ssh_dir/scanned_keys"

          if [[ ! -s "$ssh_dir/known_hosts" ]]; then
            echo '::error::No SFTP host key matches DEPLOY_HOST_FINGERPRINT. Verify the server fingerprint before updating the variable.'
            exit 1
          fi

          : "${DEPLOY_USER:?Set the production DEPLOY_USER secret}"
          : "${LFTP_PASSWORD:?Set the production DEPLOY_PASSWORD secret}"
          if [[ ! "$DEPLOY_USER" =~ ^[[:alnum:]_][[:alnum:]_-]*$ ||
                ! "$DEPLOY_DIR" =~ ^(/[[:alnum:]_.-]+)+/?$ ||
                "$DEPLOY_DIR" =~ /\.\.?(/|$) ]]; then
            echo '::error::Check the production username and absolute deployment directory.'
            exit 1
          fi

          preview=
          if [[ "$DRY_RUN" == true ]]; then
            preview=--dry-run
          fi

          # 1. Upload new fingerprinted assets first. Compare by size so a fresh
          #    build does not resend unchanged hashes. Do not delete yet.
          # 2. Publish pages with --transfer-all. A same-size index.html must
          #    still replace the live page when the server clock is ahead.
          #    Keep .htaccess and robots.txt (no --delete-excluded). Leave
          #    assets/ until the published HTML and sw.js match this build.
          # 3. Delete stale hashed assets only after that check. A tab that
          #    already loaded the previous index.html can miss its old script
          #    until reload. Issue #33 asks to remove those files.
          if [[ "$DRY_RUN" == true ]]; then
            lftp --norc -f /dev/stdin <<EOF
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 2
            set sftp:auto-confirm no
            set sftp:connect-program "ssh -a -x -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o VerifyHostKeyDNS=no -o UserKnownHostsFile=$ssh_dir/known_hosts -o ConnectTimeout=15"
            set xfer:use-temp-file yes
            open --env-password -u "$DEPLOY_USER" "sftp://$DEPLOY_HOST:$DEPLOY_PORT"
            cd "${DEPLOY_DIR%/}"
            mirror --reverse --no-perms --ignore-time --verbose $preview dist/assets assets
            mirror --reverse --delete --no-perms --transfer-all --verbose --exclude-glob .htaccess --exclude-glob robots.txt --exclude ^assets/ $preview dist .
            mirror --reverse --delete --no-perms --ignore-time --verbose $preview dist/assets assets
            bye
            EOF
          else
            lftp --norc -f /dev/stdin <<EOF
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 2
            set sftp:auto-confirm no
            set sftp:connect-program "ssh -a -x -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o VerifyHostKeyDNS=no -o UserKnownHostsFile=$ssh_dir/known_hosts -o ConnectTimeout=15"
            set xfer:use-temp-file yes
            open --env-password -u "$DEPLOY_USER" "sftp://$DEPLOY_HOST:$DEPLOY_PORT"
            cd "${DEPLOY_DIR%/}"
            mirror --reverse --no-perms --ignore-time --verbose dist/assets assets
            mirror --reverse --delete --no-perms --transfer-all --verbose --exclude-glob .htaccess --exclude-glob robots.txt --exclude ^assets/ dist .
            get index.html -o "$check_dir/index.html"
            get sw.js -o "$check_dir/sw.js"
            bye
            EOF
            if ! cmp -s dist/index.html "$check_dir/index.html"; then
              echo '::error::The published index.html does not match the build. Old hashed assets were kept.'
              exit 1
            fi
            if ! cmp -s dist/sw.js "$check_dir/sw.js"; then
              echo '::error::The published sw.js does not match the build. Old hashed assets were kept.'
              exit 1
            fi
            lftp --norc -f /dev/stdin <<EOF
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 2
            set sftp:auto-confirm no
            set sftp:connect-program "ssh -a -x -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o VerifyHostKeyDNS=no -o UserKnownHostsFile=$ssh_dir/known_hosts -o ConnectTimeout=15"
            set xfer:use-temp-file yes
            open --env-password -u "$DEPLOY_USER" "sftp://$DEPLOY_HOST:$DEPLOY_PORT"
            cd "${DEPLOY_DIR%/}"
            mirror --reverse --delete --no-perms --ignore-time --verbose dist/assets assets
            bye
            EOF
          fi
