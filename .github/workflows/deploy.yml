name: Deploy nai-tagdeck

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview files without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nai-tagdeck-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass
      - name: Sync the build to the web server
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_USER:?Set the production DEPLOY_USER secret}"
          : "${SSHPASS:?Set the production DEPLOY_PASSWORD secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the production DEPLOY_KNOWN_HOSTS variable}"
          if [[ ! "$DEPLOY_HOST" =~ ^[[:alnum:]][[:alnum:].-]*$ ||
                ! "$DEPLOY_USER" =~ ^[[:alnum:]_][[:alnum:]_-]*$ ||
                ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ||
                ! "$DEPLOY_DIR" =~ ^(/[[:alnum:]_.-]+)+/?$ ||
                "$DEPLOY_DIR" =~ /\.\.?(/|$) ]]; then
            echo '::error::Check the production host, username, port, and absolute deployment directory.'
            exit 1
          fi

          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          export RSYNC_RSH="sshpass -e ssh -p $DEPLOY_PORT -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o ConnectTimeout=15"
          destination="$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_DIR%/}"
          options=(-r --checksum --itemize-changes)
          if [[ "$DRY_RUN" == true ]]; then
            options+=(--dry-run)
          fi

          # Upload fingerprinted assets before publishing pages that reference them.
          rsync "${options[@]}" dist/assets/ "$destination/assets/"
          rsync "${options[@]}" --delay-updates --exclude='/assets/' --exclude='/.htaccess' dist/ "$destination/"
