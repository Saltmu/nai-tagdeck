name: Deploy nai-tagdeck

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview files without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nai-tagdeck-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload the build over SFTP
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_USER:?Set the production DEPLOY_USER secret}"
          : "${LFTP_PASSWORD:?Set the production DEPLOY_PASSWORD secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the production DEPLOY_KNOWN_HOSTS variable}"
          if [[ ! "$DEPLOY_HOST" =~ ^[[:alnum:]][[:alnum:].-]*$ ||
                ! "$DEPLOY_USER" =~ ^[[:alnum:]_][[:alnum:]_-]*$ ||
                ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ||
                ! "$DEPLOY_DIR" =~ ^(/[[:alnum:]_.-]+)+/?$ ||
                "$DEPLOY_DIR" =~ /\.\.?(/|$) ]]; then
            echo '::error::Check the production host, username, port, and absolute deployment directory.'
            exit 1
          fi

          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          host_lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then
            host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          if ! ssh-keygen -l -F "$host_lookup" -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo '::error::DEPLOY_KNOWN_HOSTS must contain a valid OpenSSH known_hosts entry for DEPLOY_HOST and DEPLOY_PORT (host, key type, and public key). See the README deployment instructions.'
            exit 1
          fi

          preview=
          if [[ "$DRY_RUN" == true ]]; then
            preview=--dry-run
          fi

          # Upload fingerprinted assets before publishing pages that reference them.
          lftp --norc -f /dev/stdin <<EOF
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o ConnectTimeout=15"
          set xfer:use-temp-file yes
          open --env-password -u "$DEPLOY_USER" "sftp://$DEPLOY_HOST:$DEPLOY_PORT"
          cd "${DEPLOY_DIR%/}"
          mirror --reverse --no-perms --transfer-all --verbose $preview dist/assets assets
          mirror --reverse --no-perms --transfer-all --verbose --exclude-glob=assets/ --exclude-glob=.htaccess $preview dist .
          bye
          EOF
